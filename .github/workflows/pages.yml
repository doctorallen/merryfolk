name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done
      - name: Check every script in index.html exists
        run: |
          grep -o 'src="js/[^"]*"' index.html | cut -d'"' -f2 | while read -r f; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          touch _site/.nojekyll
          stamp="build ${{ github.run_number }} · ${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M') UTC"
          printf "'use strict';\nconst BUILD_INFO = '%s';\n" "$stamp" > _site/js/version.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
