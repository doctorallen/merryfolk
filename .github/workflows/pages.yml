name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done
      - name: Check every script in index.html exists
        run: |
          grep -o 'src="js/[^"]*"' index.html | cut -d'"' -f2 | while read -r f; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js talk _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # The headless tests: static checks, the world-generation golden hashes,
  # a two-day smoke run with a save round trip, and the valley planner.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci
      - run: npm test
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: [check, test]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
